name: Build MultiClone Phase 3 PoC APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Assemble Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            PROJECT_DIR="."
          elif [ -f "./MultiClone/gradlew" ]; then
            PROJECT_DIR="./MultiClone"
          else
            echo "Error: gradlew not found in root or MultiClone/"
            find . -maxdepth 3
            exit 1
          fi

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiClone-Phase3-PoC-Debug-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          retention-days: 14
